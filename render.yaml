services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: vendor-apex-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://vendor-apex-web.onrender.com
      - key: PORT
        value: 10000
    healthCheckPath: /api/health

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: vendor-apex-web
    runtime: static
    rootDir: apps/web
    buildCommand: ""
    staticPublishPath: public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

